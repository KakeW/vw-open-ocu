name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Test the MQTT worker lifecycle
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Icomponents/vw_open_ocu \
            tests/test_mqtt_lifecycle.cpp -o "$RUNNER_TEMP/ocu-mqtt-lifecycle"
          "$RUNNER_TEMP/ocu-mqtt-lifecycle"
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          . /opt/esp/idf/export.sh
          cd firmware/esp32-c3
          idf.py set-target esp32c3
          idf.py build
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - home_assistant: '2026.10.0'
            supervisor: '0.6.0'
          - home_assistant: '2026.11.1'
            supervisor: '0.8.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant smoke-test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/ocu-ha"
          "$RUNNER_TEMP/ocu-ha/bin/python" -m pip install \
            homeassistant==${{ matrix.home_assistant }} paho-mqtt==2.1.0 aiohasupervisor==${{ matrix.supervisor }}
      - name: Run Home Assistant against a loopback MQTT broker
        run: |
          printf 'listener 1883\nallow_anonymous true\n' > "$RUNNER_TEMP/ocu-mosquitto.conf"
          broker_id=$(docker run --detach --rm --publish 127.0.0.1:31883:1883 \
            --volume "$RUNNER_TEMP/ocu-mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98)
          trap 'docker stop "$broker_id" >/dev/null' EXIT
          PYTHONPATH=. "$RUNNER_TEMP/ocu-ha/bin/python" tests/ha_smoke.py 31883
  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install esphome==2026.9.1
      - name: Stage the Device Builder example with synthetic secrets
        run: |
          mkdir "$RUNNER_TEMP/ocu-builder"
          cp -R components "$RUNNER_TEMP/ocu-builder/components"
          cp firmware/esphome/vw-open-ocu.yaml "$RUNNER_TEMP/ocu-builder/"
          test_key=$(openssl rand -base64 32)
          sed "s|replace-with-a-unique-32-byte-base64-key|$test_key|" \
            firmware/esphome/secrets.example.yaml > "$RUNNER_TEMP/ocu-builder/secrets.yaml"
      - name: Compile the ESP32-C3 ESPHome image
        run: esphome compile "$RUNNER_TEMP/ocu-builder/vw-open-ocu.yaml"
