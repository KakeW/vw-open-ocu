# Copy these keys into Device Builder's secrets editor and replace every value.
ocu_wifi_ssid: replace-me
ocu_wifi_password: replace-me
# Generate a unique 32-byte base64 API and OTA key.
ocu_api_key: replace-with-a-unique-32-byte-base64-key
ocu_mqtt_uri: mqtts://broker.example.net:8883
ocu_mqtt_username: replace-me
ocu_mqtt_password: replace-me
# For a private CA, add ocu_mqtt_ca_certificate as a PEM block.
